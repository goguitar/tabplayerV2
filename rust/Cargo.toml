[workspace]
members = [
    "audio",
    "parser",
    "gameplay",
    "sync",
    "ffi",
    "bindings",
    "godot_bridge",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
ringbuf = "0.4"
quick-xml = "0.37"
rkyv = "0.8"
godot = { version = "=0.5.2", features = ["api-4-5"] }
once_cell = "1"
